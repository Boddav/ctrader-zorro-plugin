; cTrader plugin risk config
; ---------------------------
; Place this file next to cTrader.dll (the Zorro Plugin folder).
; It is read once at login. Lines starting with ';' are comments.
;
; MaxMarginPct
;   The maximum share of ACCOUNT EQUITY (percent) that THIS Zorro instance
;   may hold as margin across all its open positions. Before each order the
;   plugin adds up its own used margin plus the new order's estimated margin;
;   if the total would exceed this budget, the order is rejected (logged).
;
;   Purpose: when several strategies share ONE cTrader account, each instance
;   sees the whole account's free margin, so a per-order guard alone cannot
;   stop them from filling the account together. Give each instance a slice
;   (e.g. two strategies at 40 => at most 80% of equity used, leaving a
;   buffer for open-trade drawdown and avoiding margin calls).
;
;   0, or this file missing, disables the budget (the account-wide 90%
;   free-margin guard still applies).
MaxMarginPct = 40
