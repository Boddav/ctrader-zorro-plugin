; Jev kapuor - a cTrader.dll plugin olvassa, bejelentkezeskor.
; Helye: <Zorro>\Plugin\JevGate\JevGate.ini   (kulon almappa, a cTrader.ini-tol fuggetlen)
;
; Mode      off     = kikapcsolva (mintha a fajl sem lenne)
;           log     = minden uj nyitas elott megkerdezi a Jevet es FELIRJA, de NEM tilt
;           enforce = ha a Jev eselye MinProb alatt van, a megbizas NEM megy ki
Mode      = log

; Mely Zorro-ablakokra vonatkozik (az ablak cimeben a " - " utani szo, pl. "Z12+ Demo" -> Z12).
; Ures = minden ablakra.
Tags      = Z1 Z12

; enforce modban ennyi esely alatt tilt (a Jev "a kotes 1 ATR-t megy a javara, mielott 1 ATR-t ellene").
MinProb   = 0.50

; A Jev szerver (JevServer.py) portja es varakozasi ideje
Port      = 5003
TimeoutMs = 8000

; Ha a Jev szerver nem valaszol: 1 = engedi a kotest, 0 = tiltja (csak enforce modban szamit)
FailOpen  = 1
